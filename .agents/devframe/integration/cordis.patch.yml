# The L-Integration pluginized-hierarchy profile layer: the six experimental
# plugins over dsh-base + dsh-headless. Mount with
# `dsh --profile integration --patch <this file>` against the isolated home
# C:\Users\25313\.dsh-integration. Row order carries no load semantics
# (activation is service-availability driven); agent-hierarchy hard-injects
# ctx.agentBindings, so session-identity must be in the tree for it to mount.
#
# project-contracts is a type vocabulary, not a plugin; it resolves as a
# dependency of the mounted packages.
#
# The base tree's tool-worktree row hard-injects workspaceRegistry and
# worktreeRegistry. The shipped headless bundle now carries the two provider
# rows itself (p/bundlefix `06d6950c38`, mirrored from this archive's
# original M4 inserts), so the archive no longer mounts them — keeping them
# here would duplicate the loader entry ids in every headless-bearing stack.
# The base-only probe composition covers the gap with its own probe-owned
# provider rows instead (see probe-cold-recovery.ts).

# One compression per sessions root is enforced fail-loud; the integration
# line standardizes on uncompressed JSONL so persisted sessions stay
# readable as evidence (same convention as the snapshot compositions).
# session-persistence-jsonl exists in the base tree, so this is an
# id-targeted restate, not an insert.
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: session-identity
      name: '@deepseek-ai/dsh-experimental-session-identity'

    - id: agent-hierarchy
      name: '@deepseek-ai/dsh-experimental-agent-hierarchy'
      config:
        roleToolPolicies:
          controller:
            inheritedTools:
              - pwsh
              - create_goal
              - edit
              - exit_plan_mode
              - get_goal
              - glob
              - grep
              - interrupt_agent
              - job_kill
              - job_list
              - job_output
              - list_agents
              - memory_append
              - memory_read
              - memory_search
              - ralph
              - read
              - read_image
              - send_message
              - skill
              - str_replace_editor
              - subagent
              - subagent_fork
              - todo_write
              - update_goal
              - web_fetch
              - web_search
              - workflow
              - write
          lead:
            inheritedTools:
              - pwsh
              - create_goal
              - edit
              - exit_plan_mode
              - get_goal
              - glob
              - grep
              - interrupt_agent
              - job_kill
              - job_list
              - job_output
              - list_agents
              - memory_append
              - memory_read
              - memory_search
              - ralph
              - read
              - read_image
              - send_message
              - skill
              - str_replace_editor
              - subagent
              - subagent_fork
              - todo_write
              - update_goal
              - web_fetch
              - web_search
              - workflow
              - write
          worker:
            inheritedTools:
              - pwsh
              - create_goal
              - edit
              - get_goal
              - glob
              - grep
              - job_kill
              - job_list
              - job_output
              - memory_append
              - memory_read
              - memory_search
              - read
              - read_image
              - send_message
              - skill
              - str_replace_editor
              - todo_write
              - update_goal
              - web_fetch
              - web_search
              - write
        delegationToolNames: [subagent, subagent_fork]
        leadPluginScopes: {}

    - id: project-controller
      name: '@deepseek-ai/dsh-experimental-project-controller'
      config:
        maxActiveTasks: 2

    - id: agent-evidence
      name: '@deepseek-ai/dsh-experimental-agent-evidence'

    - id: agent-reliability
      name: '@deepseek-ai/dsh-experimental-agent-reliability'

    # Write-enabled local instance: the Vault root is a probe-owned directory
    # under the isolated integration home (never the shared home), so appends
    # land in an explicitly isolated local path. User scope stays off
    # (userScopeEnabled false). workspaceId is the integration test value, not
    # a product workspace identity.
    - id: project-memory
      name: '@deepseek-ai/dsh-experimental-project-memory'
      config:
        workspaceId: integration
        vaultRoot: !!js dshHomePath('integration-vault')
        writeEnabled: true
        userScopeEnabled: false

    # Declarative designation face: this row declares the Shadow session id
    # (shadowSessionId), and the service performs the real markShadow
    # invocation itself — immediately when an agent with that id is already
    # live at activation, otherwise when the host creates it. The marking
    # stays inert until a host creates an agent with that id; with the field
    # unconfigured or the id never created, the four project tools stay
    # scope-isolated and every service call fails closed with
    # SHADOW_CALLER_FORBIDDEN. authorizedRoots remains fail-closed (every
    # entry must be an existing absolute directory at load) and points at one
    # probe-owned workspace directory under the isolated home.
    - id: shadow-router
      name: '@deepseek-ai/dsh-experimental-shadow-router'
      config:
        authorizedRoots:
          - !!js dshHomePath('integration-shadow-roots')
        shadowSessionId: session-shadow
