# Opt-in Web composition for inspecting the self-referential Cordis tools.
# Temporary Plugin code can reach every injected live capability; treat this
# deployment like shell access, not as a security boundary.
# This file is a PATCH OVERLAY over the web profile (dsh-base + dsh-web-app
# bundle layers), not a tree: `dsh web --patch` applies it as one more sibling
# patch list at the same include level, so these patches reach every bundle
# row. A patch replaces the targeted row's whole `config`.

# Pinning the port here keeps this demo off the default 3080.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3081

- insert:
    # cordis-host-runner is already inserted by the web-app bundle layer; a
    # second insert here is a duplicate-id loader error at boot, so this
    # overlay only adds the rows below.
    - id: tool-cordis
      name: '@deepseek-ai/dsh-tool-cordis'

# The DevFrame hierarchy stack (session identity, shadow routing, project
# memory, goal binding, the three-role hierarchy policy, and dispatch) lives
# in its own private profile layer so the experimental packages stay out of
# the app's production dependencies:
#   packages/experimental/devframe-profile/cordis.patch.yml
# Apply it after this overlay:
#   dsh --profile web --patch <this file> \
#     --patch packages/experimental/devframe-profile/cordis.patch.yml
