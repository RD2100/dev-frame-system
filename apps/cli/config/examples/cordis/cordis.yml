# Opt-in Web composition for inspecting the self-referential Cordis tools.
# Temporary Plugin code can reach every injected live capability; treat this
# deployment like shell access, not as a security boundary.
# This file is a PATCH OVERLAY over the web profile (dsh-base + dsh-web-app
# bundle layers), not a tree: `dsh web --patch` applies it as one more sibling
# patch list at the same include level, so these patches reach every bundle
# row. A patch replaces the targeted row's whole `config`.

# Pinning the port here keeps this demo off the default 3080.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3081

# DevFrame user-path plugins (V1.4): safe machine-neutral defaults. A
# deployment narrows them through a later --patch overlay (authorizedRoots,
# vaultRoot, shadowSessionId, workspace identity), not by editing this file.
# shadow-router: fail-closed until configured — no authorized roots, no
# declared Shadow session, so no project_* tools install anywhere.
# project-memory: unconfigured Vault keeps the tools read-only
# (MEMORY_UNAVAILABLE) until a real vaultRoot is supplied.
# command-goal-binding: binds the launch directory as the goal worktree;
# /devframe-start executes the required checks below as real subprocesses.
- insert:
    # cordis-host-runner is already inserted by the web-app bundle layer; a
    # second insert here is a duplicate-id loader error at boot, so this
    # overlay only adds the rows below.
    - id: tool-cordis
      name: '@deepseek-ai/dsh-tool-cordis'
    - id: session-identity
      name: '@deepseek-ai/dsh-experimental-session-identity'
    - id: shadow-router
      name: '@deepseek-ai/dsh-experimental-shadow-router'
    - id: project-memory
      name: '@deepseek-ai/dsh-experimental-project-memory'
      config:
        workspaceId: default
        writeEnabled: false
        userScopeEnabled: false
    - id: command-goal-binding
      name: '@deepseek-ai/dsh-experimental-command-goal-binding'
      config:
        workspaceId: default
        workspaceRoot: !!js process.cwd()
        maxAttempts: 3
        maxGoalRounds: 8
        taskIds: ['devframe-goal']
        checks:
          version: 1
          checks:
            - checkId: git-diff-check
              executable: git
              arguments: ['diff', '--check']
              cwd: !!js process.cwd()
    # Three-role tool faces over the hierarchy policy. Controller and lead keep
    # the shipped global surface plus the dispatch tool; the worker face starts
    # empty (fail closed) and is expanded in the same deployment commit that
    # preallocates leadPluginScopes entries. Delegation tool names match the
    # actually registered tool names of the base bundle subagent rows.
    - id: agent-hierarchy
      name: '@deepseek-ai/dsh-experimental-agent-hierarchy'
      config:
        roleToolPolicies:
          controller:
            inheritedTools: !!js "[...(process.platform === 'win32' ? ['pwsh'] : ['bash']), 'read', 'write', 'edit', 'read_image', 'str_replace_editor', 'glob', 'grep', 'web_fetch', 'web_search', 'skill', 'todo_write', 'job_kill', 'job_list', 'job_output', 'subagent', 'subagent_fork', 'interrupt_agent', 'send_message', 'list_agents', 'workflow', 'worktree_create', 'worktree_list', 'worktree_prune', 'worktree_remove', 'worktree_status', 'create_goal', 'get_goal', 'update_goal', 'ralph', 'ralph-loop', 'cordis_define', 'cordis_inspect_list', 'cordis_inspect_query', 'cordis_inspect_self', 'cordis_run', 'cordis_stop', 'cordis_undefine', 'agent_dispatch']"
          lead:
            inheritedTools: !!js "[...(process.platform === 'win32' ? ['pwsh'] : ['bash']), 'read', 'write', 'edit', 'read_image', 'str_replace_editor', 'glob', 'grep', 'web_fetch', 'web_search', 'skill', 'todo_write', 'job_kill', 'job_list', 'job_output', 'subagent', 'subagent_fork', 'interrupt_agent', 'send_message', 'list_agents', 'workflow', 'worktree_create', 'worktree_list', 'worktree_prune', 'worktree_remove', 'worktree_status', 'create_goal', 'get_goal', 'update_goal', 'ralph', 'ralph-loop', 'cordis_define', 'cordis_inspect_list', 'cordis_inspect_query', 'cordis_inspect_self', 'cordis_run', 'cordis_stop', 'cordis_undefine', 'agent_dispatch']"
          worker:
            inheritedTools: []
        leadPluginScopes: {}
    - id: agent-dispatch
      name: '@deepseek-ai/dsh-experimental-agent-dispatch'
