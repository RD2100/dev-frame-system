# The dispatch chain rows over the real web composition, mounted test-locally
# through the scaffold's private-profile seam. A2 delivered the package and
# the resolver; the shipped-profile row is the 总控's single write, and this
# overlay is the C-line gate's own face — its row block is the mapping the
# shipped row mirrors, and the file never lands in a shipped profile.
#
# The worker allow face follows the standard preset's platform seam, because
# the real gate round's worker needs the shell tool its platform actually
# serves; controller and lead make no model calls in the gate (the B1 shape),
# so their allow faces stay empty. The scope row approves exactly the one
# preallocated lead the scenario dispatches under.
- insert:
    - id: agent-bindings
      name: '@deepseek-ai/dsh-experimental-session-identity'

    - id: agent-hierarchy
      name: '@deepseek-ai/dsh-experimental-agent-hierarchy'
      config:
        roleToolPolicies:
          controller:
            inheritedTools: []
          lead:
            inheritedTools: []
          worker:
            inheritedTools: !!js "process.platform === 'win32' ? ['pwsh'] : ['bash']"
        leadPluginScopes:
          dispatch-gate-lead:
            - dispatch-gate

    - id: agent-dispatch
      name: '@deepseek-ai/dsh-experimental-agent-dispatch'
