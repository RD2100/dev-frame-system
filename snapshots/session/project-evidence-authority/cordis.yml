# Test-only delivery composition; the headless Agent has no project Lead binding.
- insert:
    - id: evidence-session-identity
      name: '../../../packages/experimental/session-identity/lib/index.js'
    - id: evidence-controller
      name: '../../../packages/experimental/project-controller/lib/index.js'
    - id: evidence-consumer
      name: '../../../packages/experimental/project-controller/lib/delivery-consumer.js'
      config:
        requiredChecksPath: !!js dshHomePath('project-checks.json')
        requiredChecksByTask: {}
        gitExecutable: git
        gitTimeoutMs: 15000
        gitMaxOutputBytes: 1048576
        checkTimeoutMs: 15000
        checkMaxOutputBytes: 1048576
