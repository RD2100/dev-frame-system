# Optional controller integration composition; the ordinary headless Agent has no controller binding.
- insert:
    - id: integration-session-identity
      name: '../../../packages/experimental/session-identity/lib/index.js'
    - id: integration-controller
      name: '../../../packages/experimental/project-controller/lib/index.js'
    - id: integration-consumer
      name: '../../../packages/experimental/project-controller/lib/consumer.js'
      config:
        requiredChecksPath: !!js dshHomePath('project-checks.json')
        gitExecutable: git
        gitTimeoutMs: 15000
        gitMaxOutputBytes: 1048576

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- insert:
    - id: llm-replay
      name: '../../../packages/test-support/llm-replay/lib/index.js'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 128000
