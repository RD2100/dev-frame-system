# Keyless replay for the image-compaction scenario. This profile patch swaps
# the adapter and re-pins the recorded vision model. The replay catalog declares image input,
# so the strict read_image gate accepts the route and the tool result carries
# the durable image block.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: acp
  name: '@deepseek-ai/dsh-acp'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    compression: none

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                inputModalities: [text]
              - id: deepseek-v4-pro
                inputModalities: [text]
              - id: deepseek-v4-flash-vision-exp
                inputModalities: [text, image]
                # Route-priced request images at the provider cap; the small
                # context window turns that visual pressure into an automatic
                # compaction the text-only heuristic would not trigger.
                contextWindow: 11600
                imageRequestTokens: 384

- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'

# Automatic compaction budget centered on the win32 replay's measured pressure
# band for the image-bearing request: at the default 0.8 the post-compaction
# pressure stayed at/above the threshold and burned the summarizer retry
# (script exhausted at call #4), while the compaction keeps firing on the same
# request with fixture-identical events up to near the window edge (in-band
# probes through 0.995). 0.923 (threshold 10706 of contextWindow 11600) leaves
# >= 836 tokens of margin on both sides — an order of magnitude above the
# ~8-25 tokens of platform cwd/persona drift. The text-only history stays well
# under the threshold, so a triggered compaction proves the routed model's
# image pricing drove the pressure decision.
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    retainTokens: 100
    thresholdRatio: 0.923
