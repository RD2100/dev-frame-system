# Scripted host commands, real subprocess checks, and a file-inspecting review.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
- id: goal-round-driver
  name: '@deepseek-ai/dsh-goal-round-driver'
  disabled: true
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- insert:
    - id: restart-goal-binding
      name: '../../../packages/experimental/command-goal-binding/lib/index.js'
      config:
        workspaceId: snapshot-command-workspace
        workspaceRoot: !!js dshHomePath('integration', 'target')
        requiredChecksPath: !!js dshHomePath('command-checks.json')
        taskIds: ['snapshot-command-task']
        maxAttempts: 3
        checks:
          version: 1
          checks:
            - checkId: committed-diff
              executable: git
              arguments: ['diff', '--check']
              cwd: !!js dshHomePath('integration', 'target')
    - id: restart-fixture
      name: './fixture.ts'
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true
- insert:
    - id: llm-replay
      name: '../../../packages/test-support/llm-replay/lib/index.js'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 128000
- id: acp
  name: '@deepseek-ai/dsh-acp'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT
    compression: none
