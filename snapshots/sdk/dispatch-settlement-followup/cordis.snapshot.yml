# Keyless model response replay; all dispatch and persistence behavior stays real.
- id: llm-deepseek
  disabled: true

- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
