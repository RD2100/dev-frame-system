# 软件开发专家团数据包（M3：hierarchical 模式，六个声明阶段）。
# 本文件是纯数据：字段契约由 @deepseek-ai/dsh-experimental-expert-team 的目录加载器
# 在挂载时校验（唯一阶段 id、专家引用存在、depends_on 无环且只指向更早阶段、
# hierarchy-role 唯一 controller 且为 entry 阶段、被引用的 schema 文件存在），
# 校验失败即挂载失败。
# gate 的唯一合法取值是 human-review；产物写入 <artifactsDir>/<runId>/。
team: dev
title: 软件开发专家团
mode: hierarchical
entry: prd
phases:
  - id: prd
    expert: product-manager
    hierarchy-role: controller
    input: 运行请求给出的用户需求与业务背景
    output:
      artifact: prd.md
      schema: schemas/prd-summary.schema.json
    gate: human-review
  - id: architecture
    expert: architect
    hierarchy-role: lead
    depends_on:
      - prd
    input: prd.md 中经人类关口批准的需求范围与优先级
    output:
      artifact: design.md
      schema: schemas/design-summary.schema.json
  - id: task-breakdown
    expert: tech-lead
    hierarchy-role: lead
    depends_on:
      - architecture
    input: design.md 的系统架构与技术约束
    output:
      artifact: tasks.md
      schema: schemas/tasks-summary.schema.json
  - id: implementation
    expert: engineer
    hierarchy-role: worker
    depends_on:
      - task-breakdown
    input: tasks.md 中分配到的任务清单与验收标准；设计文档见运行目录内的 design.md
    output:
      artifact: implementation.md
      schema: schemas/implementation-summary.schema.json
  - id: testing
    expert: qa
    hierarchy-role: worker
    depends_on:
      - implementation
    input: implementation.md 的实现结果与 tasks.md 的验收标准
    output:
      artifact: test-results.md
      schema: schemas/test-results-summary.schema.json
  - id: code-review
    expert: code-reviewer
    hierarchy-role: lead
    depends_on:
      - testing
    input: implementation.md 与 test-results.md；设计文档见运行目录内的 design.md
    output:
      artifact: review.md
      schema: schemas/review-summary.schema.json
    gate: human-review
