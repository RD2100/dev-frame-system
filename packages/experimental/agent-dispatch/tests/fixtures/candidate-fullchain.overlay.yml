# Candidate full-chain loop-closure overlay (TEST FIXTURE — never shipped).
# Applied as the third sibling patch after the example overlay and the private
# DevFrame profile layer:
#   dsh --profile web --patch apps/cli/config/examples/cordis/cordis.yml \
#     --patch packages/experimental/devframe-profile/cordis.patch.yml \
#     --patch packages/experimental/agent-dispatch/tests/fixtures/candidate-fullchain.overlay.yml
# It closes the configuration the shipped overlays deliberately leave open:
# the independent candidate port, the minimal actionable Worker face over the
# shipped write/shell tools plus the delivery tool, the preallocated lead
# scope, the project-controller stack rows, and the host bootstrap opt-in.
# Per-run paths ride DSH_CANDIDATE_HOME (set by the harness to the isolated
# home), so no run state leaks into this file. Patch semantics replace the
# targeted row's whole config, exactly like the shipped overlays.

# The candidate owns its port: 0 asks the OS, so concurrent candidate runs and
# the default 3080 deployment (untouched) never collide.
- id: webserver
  config:
    host: 127.0.0.1
    port: 0

# Three-role tool faces: controller plans/starts/integrates, lead reviews and
# dispatches inside its preallocated scope, Worker delivers through the real
# shipped write/shell tools. agent_dispatch is absent from the Worker face, so
# the dispatch tool is unknown there (restrict, not deny).
- id: agent-hierarchy
  config:
    roleToolPolicies:
      controller:
        inheritedTools: !!js "[...(process.platform === 'win32' ? ['pwsh'] : ['bash']), 'read', 'write', 'edit', 'read_image', 'glob', 'grep', 'todo_write', 'agent_dispatch', 'project_host_start', 'project_task', 'project_integrate']"
      lead:
        inheritedTools: !!js "[...(process.platform === 'win32' ? ['pwsh'] : ['bash']), 'read', 'write', 'edit', 'read_image', 'glob', 'grep', 'todo_write', 'agent_dispatch', 'project_review']"
      worker:
        inheritedTools: !!js "[...(process.platform === 'win32' ? ['pwsh'] : ['bash']), 'read', 'write', 'edit', 'glob', 'grep', 'project_deliver', 'project_commit']"
    leadPluginScopes:
      candidate-fullchain-lead: ['candidate-fullchain']

# The default launch-directory goal row is disabled: the candidate mounts its
# own single composition with the real workspace facts at bootstrap.
- id: command-goal-binding
  disabled: true
# The LLM title generation (base row id session-title-llm, first-prompt
# variant) fires an auxiliary request from the root session that is outside
# the project hierarchy; its refusal killed the first turn. Titles fall back
# to the non-LLM path in the candidate.
- id: session-title-llm
  disabled: true

# The host bootstrap rides the dispatch plugin fiber as an explicit opt-in:
# the deployment must mount the project controller (the row below), and the
# approved-checks ledger is the same file the delivery tools read.
- id: agent-dispatch
  config:
    bootstrap: true
    checksLedgerPath: !!js "process.env.DSH_CANDIDATE_HOME + '/checks-ledger.json'"
    candidateScenarioPath: !!js "process.env.DSH_CANDIDATE_HOME + '/candidate-scenario.json'"
    # The fixed host-selected root session id: it mounts the request budget
    # on this single-project process scope and must equal the root id the
    # harness creates the controller session with.
    candidateRootSessionId: 'candidate-root-c14'

- insert:
    # The board service the bootstrap and all task tools consume.
    - id: project-controller
      name: '@deepseek-ai/dsh-experimental-project-controller'
      config:
        maxActiveTasks: 2
        requestBudget: 12
    # Lead reviewer assignments land on the controller's role policy from the
    # real dispatch facts (the landing journal rejects review events).
    - id: lead-role-landing
      name: '@deepseek-ai/dsh-experimental-devframe/lead-role-landing'
    # Root-only planning and Worker admission (project_task plan/start).
    - id: project-task-tool
      name: '@deepseek-ai/dsh-experimental-project-controller/task-consumer'
    # Worker delivery and independent lead review over the shared ledger.
    - id: project-delivery-tools
      name: '@deepseek-ai/dsh-experimental-project-controller/delivery-consumer'
      config:
        requiredChecksPath: !!js "process.env.DSH_CANDIDATE_HOME + '/checks-ledger.json'"
        requiredChecksByTask: {}
        # The host-registered artifact scope per task: project_commit commits
        # only these paths for the task, through the registry Service.
        commitPathsByTask:
          task-a:
            - artifact-task-a.txt
          task-b:
            - artifact-task-b.txt
        gitExecutable: git
        gitTimeoutMs: 15000
        gitMaxOutputBytes: 1048576
        checkTimeoutMs: 15000
        checkMaxOutputBytes: 1048576
    # Controller-only integration (project_integrate) through the merge gate.
    - id: project-integration-tool
      name: '@deepseek-ai/dsh-experimental-project-controller/consumer'
      config:
        requiredChecksPath: !!js "process.env.DSH_CANDIDATE_HOME + '/checks-ledger.json'"
        gitExecutable: git
        gitTimeoutMs: 15000
        gitMaxOutputBytes: 1048576
