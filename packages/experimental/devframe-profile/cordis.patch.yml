# Private DevFrame profile layer. Apply after the web profile (dsh-base +
# dsh-web-app bundle layers) so these inserts land beside the bundle rows.
# This file is a patch list, not a tree: `--patch` applies it as one more
# sibling patch list at the same include level, so these patches reach every
# bundle row. A patch replaces the targeted row's whole `config`.
#
# DevFrame user-path plugins (V1.4): safe machine-neutral defaults. A
# deployment narrows them through a later --patch overlay (authorizedRoots,
# vaultRoot, shadowSessionId, workspace identity), not by editing this file.
# shadow-router: fail-closed until configured — no authorized roots, no
# declared Shadow session, so no project_* tools install anywhere.
# project-memory: unconfigured Vault keeps reads unavailable and appends
# disabled until a real vaultRoot is supplied and writes are explicitly enabled.
# command-goal-binding: binds the launch directory as the goal worktree;
# /devframe-start executes the required checks below as real subprocesses.
# Agent Teams: the DevFrame profile carries the Team domain, scoped tools, and
# browser action together. The overlapping global continuation controls are
# disabled so one Agent scope has one owner for list/send/interrupt operations;
# ordinary fresh and fork delegation remains available as one-shot tools.
- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot

- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot

- insert:
    # Console exporter for the host process logger: the web composition mounts
    # no other exporter, so without this row every ctx.logger.warn/error —
    # including plugin startup failures — is silently dropped.
    - id: logger-console
      name: '@deepseek-ai/cordis-plugin-logger-console'
    # cordis-host-runner is already inserted by the web-app bundle layer; this
    # layer adds only the rows below.
    - id: session-identity
      name: '@deepseek-ai/dsh-experimental-session-identity'
    - id: shadow-router
      name: '@deepseek-ai/dsh-experimental-shadow-router'
    # Read-only Remote owner of the router's status snapshot; the Web Shadow
    # entry card (shadow-web-profile layer) reads it. Mounted beside its
    # provider so the card reports the mounted deployment's real facts.
    - id: shadow-controller
      name: '@deepseek-ai/dsh-experimental-shadow-controller'
    # The persistent Shadow conversation host: creates/restores the designated
    # session and serves the human's chat faces (postMessage/readConversation).
    # Inert (fail-closed) while the shadow-router row declares no
    # shadowSessionId; with one declared, the designated session becomes the
    # human's conversational Shadow.
    - id: shadow-agent
      name: '@deepseek-ai/dsh-experimental-shadow-controller/shadow-agent'
    - id: project-memory
      name: '@deepseek-ai/dsh-experimental-project-memory'
      config:
        workspaceId: default
        writeEnabled: false
        userScopeEnabled: false
    - id: command-goal-binding
      name: '@deepseek-ai/dsh-experimental-command-goal-binding'
      config:
        workspaceId: default
        workspaceRoot: !!js process.cwd()
        requiredChecksPath: !!js dshHomePath('required-checks.json')
        maxAttempts: 3
        maxGoalRounds: 8
        taskIds: ['devframe-goal']
        checks:
          version: 1
          checks:
            - checkId: git-diff-check
              executable: git
              arguments: ['diff', '--check']
              cwd: !!js process.cwd()
    # Three-role tool faces over the hierarchy policy. Controller and lead keep
    # the shipped global surface plus the dispatch tool; the worker face starts
    # empty (fail closed) and is expanded in the same deployment commit that
    # preallocates leadPluginScopes entries. Delegation tool names match the
    # actually registered tool names of the base bundle subagent rows.
    - id: agent-hierarchy
      name: '@deepseek-ai/dsh-experimental-agent-hierarchy'
      config:
        roleToolPolicies:
          controller:
            inheritedTools: !!js "['agent_dispatch', 'browser_click', 'browser_fill', 'browser_open', 'browser_snapshot', 'browser_tabs', 'expert_team_approve', 'expert_team_list', 'expert_team_run', 'expert_team_status', 'generate_image', 'library_list', 'library_read', 'library_search', 'library_status', 'memory_append', 'memory_read', 'memory_search', 'project_commit', 'project_deliver', 'project_evidence', 'project_integrate', 'project_review', 'project_task', 'subagent_claude_code', 'subagent_codex', 'worker_antigravity', 'worker_cursor']"
          lead:
            inheritedTools: !!js "['agent_dispatch', 'browser_click', 'browser_fill', 'browser_open', 'browser_snapshot', 'browser_tabs', 'expert_team_approve', 'expert_team_list', 'expert_team_run', 'expert_team_status', 'generate_image', 'library_list', 'library_read', 'library_search', 'library_status', 'memory_append', 'memory_read', 'memory_search', 'project_commit', 'project_deliver', 'project_evidence', 'project_integrate', 'project_review', 'project_task', 'subagent_claude_code', 'subagent_codex', 'worker_antigravity', 'worker_cursor']"
          worker:
            inheritedTools: []
        leadPluginScopes: {}
    # Agent dispatch: its worktree-registry service dependency is mounted by
    # the web-app bundle layer (and headless/sdk/acp equivalents), which
    # precedes this layer in the profile composition, so the service is live
    # before this row activates.
    - id: agent-dispatch
      name: '@deepseek-ai/dsh-experimental-agent-dispatch'
    # Expert mode: the shipped paper and development packs are mounted as
    # source-checkout data, while run artifacts stay under the DSH home. A
    # later deployment overlay may replace the pack list or artifact root.
    - id: expert-team
      name: '@deepseek-ai/dsh-experimental-expert-team'
      config:
        packs:
          - !!js process.cwd() + '/packages/experimental/expert-pack-paper'
          - !!js process.cwd() + '/packages/experimental/expert-pack-dev'
        artifactsDir: !!js dshHomePath('expert-team-runs')
    # Browser-only presentation of the same Host Remote; the package root is
    # inert in headless compositions and its /client export is selected by the
    # Web loader.
    - id: ui-expert-team
      name: '@deepseek-ai/dsh-experimental-client-ui-expert-team'
    # Browser-only Library page over the read-only Vault; the package root is
    # inert in headless compositions and its /client export is selected by the
    # Web loader.
    - id: ui-project-memory
      name: '@deepseek-ai/dsh-experimental-client-ui-project-memory'
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork
    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
